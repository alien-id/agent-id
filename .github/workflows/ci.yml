name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default-deny at the top level. Each job re-grants the minimum it needs.
permissions: {}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            run: bun run test
          - name: Public-repo hygiene
            run: bun run ci:hygiene
          - name: Script tests
            run: bun test scripts/tests
          - name: Version sync (drift check)
            run: |
              bun run sync-plugin-versions
              git diff --exit-code -- plugins/**/.claude-plugin/plugin.json .claude-plugin/marketplace.json

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun project
        uses: ./.github/actions/setup-bun-project

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  changeset-status:
    name: Changeset status (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun project
        uses: ./.github/actions/setup-bun-project

      - name: Show pending changesets
        run: bun changeset status --since=origin/${{ github.base_ref }} --verbose
        continue-on-error: true
